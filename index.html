<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyayaNetra - Mobile Audit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <h2 class="text-center mb-4">🔍 NyayaNetra Mobile Audit</h2>
        
        <div class="card shadow p-4 mb-4">
            <div class="mb-3">
                <label class="form-label fw-bold">Snap or Upload Package Photo</label>
                <!-- No capture attribute ensures phone shows choice: Camera OR Gallery/Album -->
                <input type="file" class="form-control" id="packageInput" accept="image/*">
            </div>
            <button class="btn btn-primary w-100" onclick="runAudit()">Run LMPC Audit</button>
        </div>

        <div id="loading" class="text-center d-none mb-3">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Processing vertical & horizontal text...</p>
        </div>

        <div id="results" class="card shadow p-4 d-none">
            <h4 class="mb-3">Audit Report</h4>
            <div id="reportContent"></div>
        </div>
    </div>

    <script>
        const cloudUrl = "https://nyayanetra-cloud.onrender.com/audit";

        async function runAudit() {
            const fileInput = document.getElementById('packageInput');
            if (fileInput.files.length === 0) {
                alert("Please select or snap a photo first!");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('results').classList.add('d-none');

            try {
                const response = await fetch(cloudUrl, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                let html = "<ul class='list-group mb-3'>";
                for (const [key, value] of Object.entries(data)) {
                    if (key !== 'raw_text') {
                        const badgeClass = value === 'PASS' ? 'bg-success' : 'bg-danger';
                        html += `<li class='list-group-item d-flex justify-content-between align-items-center'>${key}<span class='badge ${badgeClass} rounded-pill'>${value}</span></li>`;
                    }
                }
                html += "</ul>";
                html += "<h6>Extracted Text Preview:</h6><pre class='bg-light p-2 border' style='font-size:11px; max-height:180px; overflow-y:auto;'>" + (data.raw_text || "") + "</pre>";

                document.getElementById('reportContent').innerHTML = html;
                document.getElementById('results').classList.remove('d-none');
            } catch (err) {
                alert("Error connecting to cloud backend: " + err);
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        }
    </script>
</body>
</html>
